# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f44b80a06cf9296325c18eca3c544299"
name = "Audio and Video Playlist"
application_url = "https://saitriq-entertainment-player.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_themes,write_files,write_themes,write_app_proxy"

[auth]
redirect_urls = [ "https://saitriq-entertainment-player.vercel.app/auth/callback" ]

[app_proxy]
url = "https://saitriq-entertainment-player.vercel.app/apps/playlist"
subpath = "playlist"
prefix = "apps"
